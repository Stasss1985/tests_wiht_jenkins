name: Python autotests

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set custom DNS
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf

      - name: Install WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf

      - name: Configure WireGuard
        run: |
          echo "${{ secrets.WG_CONFIG }}" > wg0.conf
          sudo mv wg0.conf /etc/wireguard/
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Start WireGuard
        run: |
          sudo wg-quick up wg0

      - name: Verify CRM access
        run: |
          curl -sSf https://erp-test.karman24.ru/auth || exit 1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -n 16 -v tests/test_add_product_no_contract.py --headless

      - name: Stop WireGuard (cleanup)
        if: always()
        run: |
          sudo wg-quick down wg0 || true
