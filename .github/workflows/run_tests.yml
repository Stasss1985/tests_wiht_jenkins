name: Python autotests

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install WireGuard and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard net-tools traceroute

      - name: Configure WireGuard
        run: |
          echo "${{ secrets.WG_CONFIG }}" > wg0.conf
          # Убедимся, что весь трафик идет через VPN
          sed -i 's/AllowedIPs = .*/AllowedIPs = 0.0.0.0\/0/' wg0.conf
          sudo mv wg0.conf /etc/wireguard/
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Setup DNS manually
        run: |
          sudo systemctl stop systemd-resolved || true
          sudo systemctl disable systemd-resolved || true
          sudo rm -f /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf
          sudo chattr -i /etc/resolv.conf || true

      - name: Start WireGuard
        run: |
          sudo wg-quick up wg0
          echo "=== WG Status ==="
          sudo wg show
          echo "=== Interface ==="
          ip a show wg0
          echo "=== Routing Table ==="
          ip route show
          echo "=== VPN Endpoint ==="
          curl -s ifconfig.me

      - name: Add hosts entry
        run: |
          echo "109.235.189.130 erp-test.karman24.ru" | sudo tee -a /etc/hosts

      - name: Network diagnostics
        run: |
          echo "=== Ping Test ==="
          ping -c 4 109.235.189.130 || true
          echo "=== Traceroute Test ==="
          traceroute -T -p 443 109.235.189.130 || true
          echo "=== Port Check (443) ==="
          timeout 15 nc -zv 109.235.189.130 443 || true
          echo "=== TCP Connection Test ==="
          timeout 15 bash -c "cat < /dev/null > /dev/tcp/109.235.189.130/443" && echo "Port 443 is open" || echo "Port 443 is closed"

      - name: Verify CRM access (HTTP fallback)
        run: |
          echo "=== HTTP Fallback Test ==="
          curl -v --connect-timeout 15 http://109.235.189.130/auth || exit 1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -n 16 -v tests/test_add_product_no_contract.py --headless

      - name: Cleanup
        if: always()
        run: |
          sudo wg-quick down wg0 || true
          sudo sed -i '/erp-test.karman24.ru/d' /etc/hosts || true
