name: Python autotests with Allure History

on:
  push:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type (smoke/regress/extended/all)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regress
          - extended
          - all

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install allure-pytest pytest

      # Подготовка директорий
      - name: Prepare directories
        run: |
          mkdir -p allure-results/history
          mkdir -p allure-report

      # Загрузка истории (пропускаем ошибку если нет артефакта)
      - name: Download previous allure history
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: allure-results/history
        continue-on-error: true

      # Запуск тестов
      - name: run tests (auto-push)
        if: "github.event_name == 'push'"
        run: pytest -n 16 -v tests/test_add_product_no_contract.py --headless --alluredir=allure-results
        continue-on-error: true

      - name: run smoke tests
        if: "github.event.inputs.test_type == 'smoke'"
        run: pytest -m smoke -n 16 -v tests/test_add_product_no_contract.py --headless --alluredir=allure-results
        continue-on-error: true

      - name: run regression tests
        if: "github.event.inputs.test_type == 'regress'"
        run: pytest -m regress -n 16 -v tests/test_add_product_no_contract.py --headless --alluredir=allure-results
        continue-on-error: true

      - name: run extended tests
        if: "github.event.inputs.test_type == 'extended'"
        run: pytest -m extended -n 16 -v tests/test_add_product_no_contract.py --headless --alluredir=allure-results
        continue-on-error: true

      - name: run all tests
        if: "github.event.inputs.test_type == 'all'"
        run: pytest -n 16 -v tests/test_add_product_no_contract.py --headless --alluredir=allure-results
        continue-on-error: true

      # Настройка Allure
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -zxvf allure-2.34.1.tgz
          echo "$(pwd)/allure-2.34.1/bin" >> $GITHUB_PATH

      # Создание executor.json (исправленная версия)
      - name: Create executor info
        run: |
          echo '{
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildName": "Run #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }' > allure-results/executor.json

      # Генерация отчета
      - name: Generate Allure report
        run: |
          allure generate allure-results -o allure-report --clean
          # Создаем историю если она отсутствует
          mkdir -p allure-report/history || true

      # Сохранение артефактов
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: allure-report
          retention-days: 1

      - name: Save allure results for history
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: allure-results
          retention-days: 7

  deploy-report:
    name: Deploy Allure Report
    runs-on: ubuntu-latest
    needs: run-tests
    permissions:
      id-token: write
      contents: read
      pages: write
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: deploy-files

      # Удаляем символические ссылки (если есть)
      - name: Clean symlinks
        run: |
          find deploy-files -type l -delete

      # Проверяем размер содержимого
      - name: Check size
        run: |
          du -sh deploy-files
          if [ $(du -s deploy-files | cut -f1) -gt 10000000 ]; then
            echo "Error: Content exceeds 10GB limit"
            exit 1
          fi

      # Упаковываем заново без лишних файлов
      - name: Prepare clean deployment
        run: |
          mkdir -p clean-deploy
          cp -r deploy-files/{index.html,app.js,history,data,styles,favicon.ico} clean-deploy/ || true
          ls -la clean-deploy/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact-name: github-pages
          target-dir: clean-deploy  # Указываем очищенную папку
