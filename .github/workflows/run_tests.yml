name: Python autotests with Allure History

on:
  push:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type (smoke/regress/extended/all)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regress
          - extended
          - all

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install allure-pytest pytest
          pytest --version
          allure --version

      # Загружаем историю предыдущих запусков
      - name: Download previous allure history
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: allure-results/history
        continue-on-error: true

      # Запуск тестов
      - name: run tests (auto-push)
        if: "github.event_name == 'push'"
        run: pytest -n 16 -v tests/test_add_product_no_contract.py --headless --alluredir=allure-results
        continue-on-error: true

      - name: run smoke tests
        if: "github.event.inputs.test_type == 'smoke'"
        run: pytest -m smoke -n 16 -v tests/test_add_product_no_contract.py --headless --alluredir=allure-results
        continue-on-error: true

      - name: run regression tests
        if: "github.event.inputs.test_type == 'regress'"
        run: pytest -m regress -n 16 -v tests/test_add_product_no_contract.py --headless --alluredir=allure-results
        continue-on-error: true

      - name: run extended tests
        if: "github.event.inputs.test_type == 'extended'"
        run: pytest -m extended -n 16 -v tests/test_add_product_no_contract.py --headless --alluredir=allure-results
        continue-on-error: true

      - name: run all tests
        if: "github.event.inputs.test_type == 'all'"
        run: pytest -n 16 -v tests/test_add_product_no_contract.py --headless --alluredir=allure-results
        continue-on-error: true

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -zxvf allure-2.34.1.tgz
          echo "$(pwd)/allure-2.34.1/bin" >> $GITHUB_PATH

      # Добавляем информацию о запуске
      - name: Create executor info
        run: |
          echo ' > allure-results/executor.json

      # Генерация отчета
      - name: Generate Allure report
        run: |
          # Переносим историю из предыдущего отчета
          if [ -d "allure-report/history" ]; then
            mkdir -p allure-results/history
            cp -r allure-report/history/* allure-results/history/ || true
          fi
          
          # Генерируем новый отчет
          allure generate allure-results -o allure-report --clean
          
          # Проверяем структуру
          echo "Report structure:"
          ls -la allure-report/

      # Сохраняем отчет для деплоя
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 1

      # Сохраняем результаты для истории следующих запусков
      - name: Save allure results for history
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: allure-results
          retention-days: 7

  deploy-report:
    name: Deploy Allure Report
    runs-on: ubuntu-latest
    needs: run-tests
    permissions:
      id-token: write
      contents: read
      pages: write
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: .

      - name: Verify report content
        run: |
          echo "Allure report content:"
          ls -la allure-report/
          test -f allure-report/index.html || (echo "Error: index.html not found!" && exit 1)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        timeout-minutes: 11
