name: Automated tests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Choose target
        required: true
        default: second_test
        type: choice
        options:
          - first_test
          - second_test
          - all

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  download-history:
    runs-on: ubuntu-latest
    name: Download history
    steps:
      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Исправленный блок загрузки истории
      - name: Download previous artifacts
        run: |
          # Проверяем доступность API
          echo "Testing GitHub API access..."
          curl -I -H "Authorization: Bearer ${{ secrets.MY_SECRET_REPO }}" \
               -H "X-GitHub-Api-Version: 2022-11-28" \
               https://api.github.com
          
          # Получаем ID артефакта allure-results
          RESPONSE=$(curl -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MY_SECRET_REPO }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://github.com/Stasss1985/tests_wiht_jenkins/settings/secrets/actions/artifacts?name=allure-results")
          
          echo "API Response for allure-results: $RESPONSE"
          
          ARTIFACT_ID=$(echo "$RESPONSE" | python -c "import sys, json; data = json.load(sys.stdin); print(data['artifacts'][0]['id'] if data['artifacts'] else '');")
          
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No artifact found with name 'allure-results'"
          else
            echo "Downloading allure-results artifact ID: $ARTIFACT_ID"
            curl -sS -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.MY_SECRET_REPO }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://github.com/Stasss1985/tests_wiht_jenkins/settings/secrets/actions/artifacts/$ARTIFACT_ID/zip" \
              -o artifacts.zip
          fi
          
          # Получаем ID артефакта github-pages
          REPORT_RESPONSE=$(curl -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MY_SECRET_REPO }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://github.com/Stasss1985/tests_wiht_jenkins/settings/secrets/actions/artifacts?name=github-pages")
          
          echo "API Response for github-pages: $REPORT_RESPONSE"
          
          REPORT_ID=$(echo "$REPORT_RESPONSE" | python -c "import sys, json; data = json.load(sys.stdin); print(data['artifacts'][0]['id'] if data['artifacts'] else '');")
          
          if [ -z "$REPORT_ID" ]; then
            echo "No artifact found with name 'github-pages'"
          else
            echo "Downloading github-pages artifact ID: $REPORT_ID"
            curl -sS -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.MY_SECRET_REPO }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://github.com/Stasss1985/tests_wiht_jenkins/settings/secrets/actions/artifacts/$REPORT_ID/zip" \
              -o pages.zip
          fi

      # Обработка скачанных артефактов
      - name: Process artifacts
        run: |
          # Создаем директории, если артефакты не были скачаны
          mkdir -p allure-results
          mkdir -p old_pages pages_history
          
          # Обрабатываем artifacts.zip, если он существует
          if [ -f "artifacts.zip" ]; then
            unzip artifacts.zip -d allure-results
          fi
          
          # Обрабатываем pages.zip, если он существует
          if [ -f "pages.zip" ]; then
            unzip pages.zip -d old_pages
            tar -xvf old_pages/artifact.tar -C pages_history
            cp pages_history/history/* allure-results
            cp -r pages_history/history allure-results
          fi

      - name: Store allure history
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 1

  # Остальные job остаются без изменений
  test:
    runs-on: ubuntu-latest
    needs: download-history
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Chrome
        run: sudo apt-get install google-chrome-stable
      - name: install dependencies
        run: pip install -r requirements.txt
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
      - name: first_test
        if: "github.event.inputs.deployment_target == 'first_test'"
        run: pytest -m first_test -n 16 -v tests/test_add_product_no_contract.py --headless --alluredir=allure-results
        continue-on-error: true
      - name: second_test
        if: "github.event.inputs.deployment_target == 'second_test'"
        run: pytest -m second_test -n 16 -v tests/test_add_product_no_contract.py --headless --alluredir=allure-results
        continue-on-error: true
      - name: all
        if: "github.event.inputs.deployment_target == 'all'"
        run: pytest -n 16 -v tests/test_add_product_no_contract.py --headless --alluredir=allure-results
        continue-on-error: true
      - name: Store allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 1

  generate-report:
    runs-on: ubuntu-latest
    needs: test
    name: Generate report
    steps:
      - uses: actions/setup-java@v3
        with:
          distribution: 'microsoft'
          java-version: '17'
      - run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -zxvf allure-2.34.1.tgz
          echo "$(pwd)/allure-2.34.1/bin" >> $GITHUB_PATH
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
      - run: allure generate -c allure-results -o _site
      - name: Store generated report
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: _site
          retention-days: 1

  publish-report:
    runs-on: ubuntu-latest
    needs: generate-report
    name: Report publication
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4