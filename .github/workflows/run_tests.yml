name: Python autotests

on:
  push:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type (smoke/regress/extended/all)'
        required: true
        default: 'smoke'
        type: choice
        options:
        - smoke
        - regress
        - extended
        - all

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -n 16 -v tests/test_add_product_no_contract.py --headless
