name: Python autotests

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard

      - name: Configure WireGuard
        run: |
          echo "${{ secrets.WG_CONFIG }}" > wg0.conf
          # Удаляем стандартный DNS, если он есть
          sed -i '/DNS = /d' wg0.conf
          # Добавляем надежные DNS
          echo "DNS = 8.8.8.8, 1.1.1.1" >> wg0.conf
          sudo mv wg0.conf /etc/wireguard/
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Setup DNS manually
        run: |
          # Отключаем systemd-resolved
          sudo systemctl stop systemd-resolved || true
          sudo systemctl disable systemd-resolved || true
          
          # Создаем новый resolv.conf
          sudo rm -f /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf
          
          # Разрешаем изменения resolv.conf
          sudo chattr -i /etc/resolv.conf || true

      - name: Start WireGuard with manual DNS
        run: |
          # Используем опцию --no-resolvconf чтобы избежать ошибок
          sudo wg-quick up wg0 --no-resolvconf || (sudo wg-quick down wg0; exit 1)
          
          # Проверяем подключение
          echo "=== WG Status ==="
          sudo wg show
          echo "=== Interface ==="
          ip a show wg0
          echo "=== DNS Config ==="
          cat /etc/resolv.conf
          echo "=== NSLookup Test ==="
          nslookup google.com || true

      - name: Add hosts entry as fallback
        run: |
          echo "109.235.189.130 erp-test.karman24.ru" | sudo tee -a /etc/hosts
          echo "=== Ping Test ==="
          ping -c 4 erp-test.karman24.ru || true

      - name: Verify CRM access
        run: |
          echo "=== Curl Test ==="
          curl -v --connect-timeout 15 https://erp-test.karman24.ru/auth || exit 1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -n 16 -v tests/test_add_product_no_contract.py --headless

      - name: Cleanup
        if: always()
        run: |
          sudo wg-quick down wg0 || true
          sudo sed -i '/erp-test.karman24.ru/d' /etc/hosts || true
