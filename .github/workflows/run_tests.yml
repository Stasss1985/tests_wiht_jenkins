name: Python autotests

on:
  push:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type (smoke/regress/extended/all)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regress
          - extended
          - all

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install allure-pytest

      # ... шаги запуска тестов ...

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -zxvf allure-2.34.1.tgz
          echo "$(pwd)/allure-2.34.1/bin" >> $GITHUB_PATH

      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 1

  publish-report:
    name: Report publication
    runs-on: ubuntu-latest
    needs: run-tests
    permissions:
      id-token: write
      contents: read
      pages: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report  # Скачиваем прямо в папку allure-report

      - name: Debug file structure
        run: ls -R allure-report  # Проверка содержимого (можно удалить после отладки)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report  # Теперь путь корректен

      - name: Deploy to GitHub Pages
        id: deployment
        timeout-minutes: 10
        uses: actions/deploy-pages@v4