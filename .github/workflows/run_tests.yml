name: Python autotests

on:
  push:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type (smoke/regress/extended/all)'
        required: true
        default: 'smoke'
        type: choice
        options:
        - smoke
        - regress
        - extended
        - all

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: run smoke tests (auto)
        if: "github.event_name == 'push'"
        run: pytest -m smoke -n 16 -v tests/test_add_product_no_contract.py --headless

      - name: run smoke tests
        if: "github.event.inputs.test_type == 'smoke'"
        run: pytest -m smoke -n 16 -v tests/test_add_product_no_contract.py --headless

      - name: run regression tests
        if: "github.event.inputs.test_type == 'regress'"
        run: pytest -m regress -n 16 -v tests/test_add_product_no_contract.py --headless

      - name: run extended tests
        if: "github.event.inputs.test_type == 'extended'"
        run: pytest -m extended -n 16 -v tests/test_add_product_no_contract.py --headless

      - name: run all tests
        if: "github.event.inputs.test_type == 'all'"
        run: pytest -n 16 -v tests/test_add_product_no_contract.py --headless
