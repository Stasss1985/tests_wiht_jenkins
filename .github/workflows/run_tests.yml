name: Python autotests with Allure History

on:
  push:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type (smoke/regress/extended/all)'
        required: true
        default:|
          smoke
        type: choice
        options:
          - smoke
          - regress
          - extended
          - all

jobs:
  ##########################################################################
  # Запуск тестов, генерация отчёта и подготовка «чистой» версии
  ##########################################################################
  run-tests:
    runs-on: ubuntu-latest
    steps:
      # Checkout & Python
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install allure-pytest pytest

      # Подготовка папок
      - name: Prepare directories
        run: |
          mkdir -p allure-results/history
          mkdir -p allure-report

      # Попытка взять старую историю
      - name: Download previous allure history
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: allure-results/history
        continue-on-error: true   # первый запуск – нормально пропустить

      # Запуск тестов (один общий шаг)
      - name: Run selected tests
        env:
          TYPE: ${{ github.event.inputs.test_type }}
        run: |
          [[ -z "$TYPE" ]] && TYPE="all"

          case "$TYPE" in
            smoke)   MARK="-m smoke"   ;;
            regress) MARK="-m regress" ;;
            extended)MARK="-m extended";;
            all)     MARK=""           ;;
            *)       MARK=""           ;;
          esac

          pytest $MARK -n 16 -v tests/test_add_product_no_contract.py \
                --headless --alluredir=allure-results
        # если хотите, чтобы падение тестов делало workflow неуспешным, уберите continue‑on‑error
        continue-on-error: false

      # JDK + Allure CLI
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Install Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -xzf allure-2.34. # распаковываем
          echo "$(pwd)/allure-2.34.1/bin" >> $GITHUB_PATH

      # executor.json
      - name: Create executor info
        run: |
          cat <<EOF > allure-results/executor.json
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildName": "Run #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      # Проверка наличия результатов
      - name: Verify test results exist
        run: |
          if [ -z "$(ls -A allure-results/*.json 2>/dev/null)" ]; then
            echo "No Allure result files found."
            exit 1
          fi

      # Генерация отчёта
      - name: Generate Allure report
        run: |
          find allure-results -type l -delete
          allure generate allure-results -o allure-report --clean

      # Очистка и раскрытие символических ссылок
      - name: Prepare clean report (remove symlinks, trim history, drop big files)
        run: |
          cp -RL allure-report clean-report

          if [ -d "clean-report/history" ]; then
            cd clean-report/history
            ls -1tr | head -n -5 | xargs -r rm -rf --
            cd ../../..
          fi

          find clean-report -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) -size +1M -delete

          SIZE=$(du -sb clean-report | cut -f1)
          echo "Final report size: $SIZE bytes"
          if (( SIZE > 500000000 )); then   # ~500 MiB
            echo "Report is larger than 500 MiB, aborting."
            exit 1
          fi

      # Артефакт для GitHub Pages
      - name: Upload Allure report (static site)
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: clean-report
          retention-days: 1

      # Сохраняем результаты для следующей истории
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: allure-results
          retention-days: 7

  ##########################################################################
  # Деплой в GitHub Pages
  ##########################################################################
  deploy-report:
    name: Deploy Allure Report
    runs-on: ubuntu-latest          # ← исправлено
    needs: run-tests
    permissions:
      id-token: write
      contents: read
      pages: write
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: site

      - name: Validate site before publishing
        run: |
          if [ ! -f "site/index.html" ]; then
            echo "index.html not found in the downloaded artifact!"
            ls -R site
            exit 1
          fi
          echo "Site looks good – size:"
          du -sh site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4