name: Python autotests with Allure History

on:
  push:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type (smoke/regress/extended/all)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regress
          - extended
          - all

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install allure-pytest pytest

      # Создаем папку для результатов
      - name: Prepare directories
        run: |
          mkdir -p allure-results/history
          mkdir -p allure-report

      # Загружаем историю предыдущих запусков (если есть)
      - name: Download previous allure history
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: allure-results/history
        continue-on-error: true

      # Запуск тестов
      - name: Run tests
        run: |
          pytest -v --alluredir=allure-results tests/
        continue-on-error: true

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -zxvf allure-2.34.1.tgz
          echo "$(pwd)/allure-2.34.1/bin" >> $GITHUB_PATH

      - name: Create executor info
        run: |
          echo ' > allure-results/executor.json

      # Проверяем наличие результатов тестов
      - name: Verify test results
        run: |
          if [ ! -d "allure-results" ] || [ -z "$(ls -A allure-results)" ]; then
            echo "Error: No test results found!"
            exit 1
          fi

      # Генерация отчета
      - name: Generate Allure report
        run: |
          allure generate allure-results -o allure-report --clean
          
          # Для первого запуска создаем пустую историю
          if [ ! -d "allure-report/history" ]; then
            mkdir -p allure-report/history
          fi

      # Сохраняем отчет для деплоя (только если есть файлы)
      - name: Upload Allure report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 1

      # Сохраняем результаты для истории (только если есть файлы)
      - name: Save allure results for history
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: allure-results
          retention-days: 7

  deploy-report:
    name: Deploy Allure Report
    runs-on: ubuntu-latest
    needs: run-tests
    permissions:
      id-token: write
      contents: read
      pages: write
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: .

      - name: Verify report content
        run: |
          test -f allure-report/index.html || (echo "Error: Report not generated!" && exit 1)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4