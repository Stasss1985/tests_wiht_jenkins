name: Python autotests

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Connect to VPN
        uses: kornicameister/openvpn-connect-action@v1
        with:
          config: ${{ secrets.VPN_CONFIG }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -n 16 -v tests/test_add_product_no_contract.py --headless
