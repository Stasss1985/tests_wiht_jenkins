name: Python autotests

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install WireGuard and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard net-tools traceroute

      - name: Configure WireGuard
        run: |
          echo "${{ secrets.WG_CONFIG }}" > wg0.conf
          # Удаляем все параметры, которые не понимает wg setconf
          sed -i '/^Address/d' wg0.conf
          sed -i '/^DNS/d' wg0.conf
          sed -i '/^MTU/d' wg0.conf
          sed -i '/^Table/d' wg0.conf
          sed -i '/^PreUp/d' wg0.conf
          sed -i '/^PostUp/d' wg0.conf
          sed -i '/^PreDown/d' wg0.conf
          sed -i '/^PostDown/d' wg0.conf
          sed -i '/^SaveConfig/d' wg0.conf
          sudo mv wg0.conf /etc/wireguard/
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Setup DNS manually
        run: |
          sudo systemctl stop systemd-resolved || true
          sudo systemctl disable systemd-resolved || true
          sudo rm -f /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf
          sudo chattr -i /etc/resolv.conf || true

      - name: Start WireGuard manually
        run: |
          # Создаем интерфейс
          sudo ip link add dev wg0 type wireguard || true
          
          # Применяем чистую конфигурацию WireGuard
          sudo wg setconf wg0 /etc/wireguard/wg0.conf
          
          # Вручную добавляем IP-адрес и настройки
          sudo ip address add 10.10.251.15/32 dev wg0
          sudo ip link set mtu 1420 up dev wg0
          
          # Удаляем конфликтующие маршруты по умолчанию
          sudo ip route del default via 10.1.0.1 dev eth0 || true
          
          # Добавляем маршрут по умолчанию через VPN
          sudo ip route add default dev wg0
          
          # Даем время на установление соединения
          sleep 5
          
          # Проверяем подключение
          echo "=== WG Status ==="
          sudo wg show
          echo "=== Interface ==="
          ip a show wg0
          echo "=== Routing Table ==="
          ip route show
          echo "=== VPN Endpoint ==="
          curl -s --retry 3 ifconfig.me || curl -s --retry 3 icanhazip.com || echo "Unable to get public IP"

      - name: Add hosts entry
        run: |
          echo "109.235.189.130 erp-test.karman24.ru" | sudo tee -a /etc/hosts

      - name: Network diagnostics
        run: |
          echo "=== Ping Test ==="
          ping -c 4 109.235.189.130 || true
          echo "=== Traceroute Test ==="
          traceroute -T -p 443 109.235.189.130 || true
          echo "=== Port Check (443) ==="
          timeout 15 nc -zv 109.235.189.130 443 || true
          echo "=== TCP Connection Test ==="
          timeout 15 bash -c "cat < /dev/null > /dev/tcp/109.235.189.130/443" && echo "Port 443 is open" || echo "Port 443 is closed"

      - name: Verify CRM access (HTTP fallback)
        run: |
          echo "=== HTTP Fallback Test ==="
          curl -v --connect-timeout 15 http://109.235.189.130/auth || exit 1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -n 16 -v tests/test_add_product_no_contract.py --headless

      - name: Cleanup
        if: always()
        run: |
          sudo ip link delete dev wg0 || true
          sudo sed -i '/erp-test.karman24.ru/d' /etc/hosts || true
